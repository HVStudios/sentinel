name: Publish snapshot to GitHub Pages

# Rebuilds the static site from fresh public data. The site needs no server: the web app
# is built in static mode and answers every query from snapshot.json in the browser.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Keep the database between runs so slow enrichment (Wikidata vendor lookups) accumulates
      # and is only re-checked every 30 days. A cache miss just means a fresh database.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/sentinel.db
          key: sentinel-db-${{ github.run_id }}
          restore-keys: sentinel-db-
      - name: Ingest public sources
        # Exits non-zero only if every source fails; partial data is still published.
        run: npm run ingest
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Raises the GitHub advisories API limit from 60 to 1,000 requests an hour; read-only use.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sentinel.db
          key: sentinel-db-${{ github.run_id }}
      - run: npm run export
      - name: Build static site
        run: npm run build -w web
        env:
          VITE_STATIC: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
